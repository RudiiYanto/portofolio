<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 517" width="880" height="517">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#f5f8ff"/><stop offset="1" stop-color="#e8eefb"/>
    </linearGradient>
    <linearGradient id="bA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/>
