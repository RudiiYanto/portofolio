    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2148ee"/><stop offset="1" stop-color="#4fabf6"/>
    </linearGradient>
    <pattern id="dots2" width="14" height="14" patternUnits="userSpaceOnUse">
