  <text x="176" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700"><tspan fill="#0b1020">Label</tspan><tspan fill="#1335ea"> Print</tspan></text>
  <text x="178" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#6b7086">Model. Work Order. Printed.</text>

