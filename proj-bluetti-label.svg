        <rect x="23" y="0" width="3" height="20"/><rect x="29" y="0" width="2" height="20"/>
        <rect x="34" y="0" width="4" height="20"/><rect x="41" y="0" width="2" height="20"/>
        <rect x="46" y="0" width="3" height="20"/><rect x="52" y="0" width="2" height="20"/>
      </g>
    </g>
